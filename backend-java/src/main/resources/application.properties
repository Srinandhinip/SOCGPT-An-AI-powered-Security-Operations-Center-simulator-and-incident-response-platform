spring.application.name=socgpt-backend

# ---- database (Docker: ankane/pgvector on host port 5433) ----
spring.datasource.url=${SOCGPT_DB_URL:jdbc:postgresql://localhost:5433/socgpt}
spring.datasource.username=${SOCGPT_DB_USER:socgpt}
spring.datasource.password=${SOCGPT_DB_PASSWORD:socgpt_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# lets the UI show 409/403 messages
server.error.include-message=always
spring.web.error.include-message=always

# ---- sign-in / roles ----
# DEV VALUES: change the secret before sharing or deploying this project.
socgpt.auth.secret=dev-only-secret-change-me-before-sharing-this-project
socgpt.auth.token-hours=8
socgpt.seed-demo-users=true
# sensors (the simulator) send this in the X-Ingest-Key header when posting to /events
socgpt.ingest.key=dev-ingest-key

# ---- AI agent (Python / LangGraph / Gemini) ----
socgpt.agent.url=${SOCGPT_AGENT_URL:http://localhost:8000}
socgpt.agent.timeout-seconds=120

# ---- multi-stage attack chains ----
socgpt.chain.window-minutes=30

# ---- RAG over past incidents ----
socgpt.rag.enabled=true
socgpt.rag.min-similarity=0.5
socgpt.rag.top-k=3

# ---- e-mail alerts (Mailpit catches them: http://localhost:8025) ----
socgpt.alerts.enabled=true
socgpt.alerts.from=socgpt@localhost
# optional: comma-separated override; empty = every user with an e-mail, chosen by role
socgpt.alerts.recipients=
socgpt.base-url=http://localhost:8080
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
management.health.mail.enabled=false
